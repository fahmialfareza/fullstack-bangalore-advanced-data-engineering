services:
  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-kafbat/kafka-ui:v1.3.0}
    container_name: olist-kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-18080}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: olist-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: host.docker.internal:${KAFKA_HOST_PORT:-39092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
